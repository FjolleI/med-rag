name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t medrag:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name medrag-ci -p 8000:8000 \
            -e PINECONE_API_KEY=mock-dev \
            -e ANTHROPIC_API_KEY=mock-dev \
            medrag:ci
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API healthy"; exit 0
            fi
            sleep 2
          done
          echo "API never became healthy"; docker logs medrag-ci; exit 1
